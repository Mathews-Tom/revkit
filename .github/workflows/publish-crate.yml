name: Publish crate

on:
  push:
    tags:
      - 'v*'
      - '!v0.1.0' # The registry requires the first release to be published manually.

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-package:
    if: github.repository == 'Mathews-Tom/revkit'
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        id: release
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          test "$(uname -m)" = arm64
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "revkit") | .version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Tag must match the Cargo.toml version with a v prefix.' >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: cargo test --locked --release
      - run: cargo publish --locked --registry crates-io --dry-run

  publish:
    needs: verify-package
    runs-on: macos-15
    timeout-minutes: 10
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: registry
      - name: Publish verified source package
        run: cargo publish --locked --registry crates-io --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.registry.outputs.token }}

  verify-install:
    needs: [verify-package, publish]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Install the exact published version
        shell: bash
        env:
          VERSION: ${{ needs.verify-package.outputs.version }}
        run: |
          test "$(uname -m)" = arm64
          root=$(mktemp -d)
          cargo install --locked --registry crates-io --root "$root" revkit --version "=$VERSION"
          test "$("$root/bin/revkit" --version)" = "revkit $VERSION"
